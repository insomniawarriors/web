name: Generate site

on:
  push:
    paths:
      - contents.md
      - scripts/generate_site.py
      - .github/workflows/generate-site.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate HTML
        run: python3 scripts/generate_site.py

      - name: Commit generated HTML
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Generate site from contents.md
          file_pattern: "*.html"
